<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>香港一週脈動｜恒指 × 天氣</title>
<style>
:root{color-scheme:dark;--ink:#f3f6fb;--muted:#91a0b5;--line:#ffffff17;--panel:#0d1b2ebd;--green:#42dda0;--red:#ff6c7d;--cyan:#5fd9ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans HK",sans-serif;background:radial-gradient(circle at 12% 0%,#1b75a245,transparent 35rem),radial-gradient(circle at 95% 5%,#f5a13a21,transparent 30rem),linear-gradient(145deg,#050b14,#091728 55%,#07111f)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(#000,transparent 75%)}.shell{width:min(1160px,calc(100% - 36px));margin:auto;padding:54px 0 64px}header{display:flex;align-items:end;justify-content:space-between;gap:28px;margin-bottom:28px}.eyebrow{color:var(--cyan);font-size:.74rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;margin-bottom:10px}h1{margin:0;font-size:clamp(2rem,5vw,4.4rem);line-height:.98;letter-spacing:-.055em}h1 span{color:transparent;-webkit-text-stroke:1px #ffffff7a}.updated{color:var(--muted);text-align:right;font-size:.82rem;line-height:1.65;white-space:nowrap}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;background:var(--green);box-shadow:0 0 13px var(--green)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 70px #0004;backdrop-filter:blur(18px);overflow:hidden}.market{display:grid;grid-template-columns:minmax(280px,.78fr) 1.7fr;margin-bottom:22px}.summary{position:relative;padding:30px;border-right:1px solid var(--line);overflow:hidden}.summary:after{content:"HSI";position:absolute;right:-12px;bottom:-32px;color:#ffffff08;font-size:8rem;font-weight:900;letter-spacing:-.08em}.tag{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:.78rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase}.tag i{width:19px;height:2px;background:var(--cyan)}.big{margin:48px 0 8px;font-variant-numeric:tabular-nums;font-size:clamp(2.5rem,5.2vw,4.5rem);font-weight:760;letter-spacing:-.055em}.change{font-size:.95rem;font-weight:750}.up{color:var(--red)}.down{color:var(--green)}.flat{color:var(--muted)}.note{position:relative;z-index:1;margin-top:52px;color:var(--muted);font-size:.76rem;line-height:1.55}.chart{padding:26px 26px 20px;min-width:0}.charthead{display:flex;justify-content:space-between;margin-bottom:14px}.charthead span{color:var(--muted);font-size:.74rem}#spark{display:block;width:100%;height:210px;overflow:visible}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}.day{padding:12px 8px 10px;border-top:1px solid var(--line);min-width:0}.date{color:var(--muted);font-size:.7rem;margin-bottom:8px}.close{font-size:clamp(.82rem,1.45vw,1.02rem);font-weight:750;font-variant-numeric:tabular-nums}.move{margin-top:5px;font-size:.7rem;font-weight:700}.weather{padding:28px}.wtop{display:flex;justify-content:space-between;gap:32px;align-items:start;margin-bottom:22px}h2{margin:7px 0 0;font-size:clamp(1.35rem,3vw,2rem);letter-spacing:-.035em}.situation{max-width:590px;margin:2px 0;color:var(--muted);font-size:.8rem;line-height:1.75}.forecast{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}.card{min-width:120px;padding:17px 15px 16px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(155deg,#ffffff0b,#ffffff03);transition:.2s}.card:hover{transform:translateY(-3px);border-color:#5fd9ff4d}.card:first-child{background:linear-gradient(155deg,#5fd9ff21,#ffffff05);border-color:#5fd9ff38}.week{margin-top:3px;font-size:.92rem;font-weight:750}.icon{height:62px;display:flex;align-items:center;font-size:2.25rem;filter:drop-shadow(0 7px 14px #0004)}.temps{font-size:1.16rem;font-weight:800}.temps span{color:var(--muted);font-size:.76rem}.copy{min-height:50px;margin-top:11px;color:#c8d2df;font-size:.68rem;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.rain{display:flex;justify-content:space-between;margin-top:13px;padding-top:11px;border-top:1px solid var(--line);color:var(--muted);font-size:.66rem}.rain b{color:var(--cyan)}footer{display:flex;justify-content:space-between;gap:20px;margin-top:17px;padding:0 4px;color:#617087;font-size:.68rem}#error{display:none;margin:24px 0;padding:18px 20px;border:1px solid #ff6c7d4d;border-radius:15px;color:#ffc3cb;background:#ff6c7d14}.skeleton{animation:pulse 1.6s infinite;color:transparent!important;background:#ffffff0f;border-radius:8px}@keyframes pulse{50%{opacity:.45}}@media(max-width:790px){.shell{width:min(100% - 22px,680px);padding-top:30px}header{align-items:start;flex-direction:column}.updated{text-align:left}.market{grid-template-columns:1fr}.summary{border-right:0;border-bottom:1px solid var(--line)}.big{margin-top:32px}.note{margin-top:28px}.chart{padding:22px 15px 17px}#spark{height:155px}.weather{padding:22px 15px}.wtop{flex-direction:column;gap:14px}footer{flex-direction:column;gap:5px}}
</style></head><body><main class="shell"><header><div><div class="eyebrow">Hong Kong Weekly Pulse</div><h1>香港一週<br><span>市場 × 天氣</span></h1></div><div class="updated"><span class="dot"></span>自動更新<br><span id="updated">正在讀取最新資料…</span></div></header><div id="error"></div>
<section class="panel market"><div class="summary"><div class="tag"><i></i>恒生指數 · HSI</div><div id="latest" class="big skeleton">00,000.00</div><div id="change" class="change flat">—</div><div class="note">最近五個交易日收市表現<br>升跌比較前一交易日收市價</div></div><div class="chart"><div class="charthead"><strong>五日走勢</strong><span>收市價 · 港元</span></div><svg id="spark" viewBox="0 0 700 210" preserveAspectRatio="none" aria-label="恒生指數五日走勢"></svg><div id="days" class="days"></div></div></section>
<section class="panel weather"><div class="wtop"><div><div class="tag"><i></i>香港天文台</div><h2>未來七天天氣變化</h2></div><p id="situation" class="situation">正在讀取天氣概況…</p></div><div id="forecast" class="forecast"></div></section><footer><span>市場資料：Yahoo Finance　·　天氣資料：香港天文台</span><span>資料僅供參考，不構成投資建議</span></footer></main>
<script>
const num=new Intl.NumberFormat('zh-HK',{minimumFractionDigits:2,maximumFractionDigits:2}),sd=new Intl.DateTimeFormat('zh-HK',{month:'numeric',day:'numeric'}),dt=new Intl.DateTimeFormat('zh-HK',{timeZone:'Asia/Hong_Kong',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});const cls=v=>v>0?'up':v<0?'down':'flat',arr=v=>v>0?'▲':v<0?'▼':'—',sign=v=>`${v>0?'+':''}${num.format(v)}`;function icon(c,t=''){if([50,51,52].includes(c))return'☀️';if([53,54,60].includes(c))return'🌤️';if([61,62,63,64].includes(c))return'⛅';if(c>=65&&c<=77)return'🌧️';if(c>=80&&c<=82)return'🌫️';if(c>=90)return'⛈️';return t.includes('雨')?'🌦️':t.includes('晴')?'☀️':'☁️'}
function draw(ds){const s=document.querySelector('#spark'),v=ds.map(d=>d.close),mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1,p=v.map((n,i)=>({x:24+i*163,y:178-(n-mn)/r*142})),line=p.map((q,i)=>`${i?'L':'M'} ${q.x} ${q.y}`).join(' '),area=`${line} L ${p.at(-1).x} 198 L ${p[0].x} 198 Z`,c=v.at(-1)>=v[0]?'#ff6c7d':'#42dda0';s.innerHTML=`<defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="${c}" stop-opacity=".28"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#area)"/><path d="${line}" fill="none" stroke="${c}" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/>${p.map(q=>`<circle cx="${q.x}" cy="${q.y}" r="4.5" fill="#07111f" stroke="${c}" stroke-width="3" vector-effect="non-scaling-stroke"/>`).join('')}`}
function render(d){const ds=d.market.days,l=ds.at(-1);updated.textContent=`${dt.format(new Date(d.updatedAt))} 更新`;latest.textContent=num.format(l.close);latest.classList.remove('skeleton');change.className=`change ${cls(l.change)}`;change.textContent=`${arr(l.change)} ${sign(l.change)}　${l.changePct>0?'+':''}${l.changePct.toFixed(2)}%`;days.innerHTML=ds.map(x=>`<div class="day"><div class="date">${sd.format(new Date(x.date+'T12:00:00+08:00'))}</div><div class="close">${num.format(x.close)}</div><div class="move ${cls(x.change)}">${arr(x.change)} ${x.changePct>0?'+':''}${x.changePct.toFixed(2)}%</div></div>`).join('');draw(ds);situation.textContent=d.weather.generalSituation;forecast.innerHTML=d.weather.days.map(x=>`<article class="card"><div class="date">${sd.format(new Date(x.date+'T12:00:00+08:00'))}</div><div class="week">${x.week}</div><div class="icon">${icon(x.icon,x.weather)}</div><div class="temps">${x.minTemp}–${x.maxTemp}<span>°C</span></div><div class="copy" title="${x.weather}">${x.weather}</div><div class="rain"><span>降雨概率</span><b>${x.psr}</b></div></article>`).join('')}
fetch(`data/dashboard.json?v=${Date.now()}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}).then(render).catch(e=>{error.style.display='block';error.textContent=`暫時未能載入最新資料，請稍後再試。（${e.message}）`;updated.textContent='資料載入失敗'});
</script></body></html>
