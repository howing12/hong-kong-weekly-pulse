name: Refresh dashboard data
on:
  schedule:
    - cron: "45 9 * * 1-5" # 17:45 Hong Kong time
    - cron: "15 23 * * *"  # 07:15 Hong Kong time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch latest market and weather data
        run: node scripts/update-data.mjs
      - name: Commit changes when data is new
        run: |
          if git diff --quiet data/dashboard.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json
          git commit -m "chore: refresh dashboard data"
          git push
